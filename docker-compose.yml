services:
  postgres:
    image: postgres:17-alpine
    container_name: gameshelf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gameshelf
      POSTGRES_PASSWORD: gameshelf
      POSTGRES_DB: gameshelf
    # Host port is 5433, not 5432: a native Windows PostgreSQL service already
    # occupies 5432 on the development machine and intercepts every connection
    # to localhost:5432. Inside the container Postgres still listens on 5432.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameshelf"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
